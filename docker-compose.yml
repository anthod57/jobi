services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobi}
      POSTGRES_DB: ${POSTGRES_DB:-jobi}
    volumes:
      - jobi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobi:jobi@db:5432/jobi}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  cron:
    image: alpine:3.21
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      app:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        apk add --no-cache curl >/dev/null &&
        echo '*/15 * * * * curl -sf -X POST -H "Authorization: Bearer '"$$CRON_SECRET"'" http://app:3000/api/ingestion/cron >/dev/null' > /etc/crontabs/root &&
        crond -f -l 2
    restart: unless-stopped

volumes:
  jobi_pgdata:
